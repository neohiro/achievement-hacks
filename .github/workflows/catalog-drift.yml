name: catalog-drift

# The catalog makes factual claims about which achievements an account holds.
# This workflow is what stops those claims from silently rotting.

on:
  schedule:
    - name: weekly drift check
      cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "_achievements/**"
      - "_scripts/**"
      - "_docs/**"
      - "README.md"
      - "tests/**"

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # From requirements.txt rather than a package list spelled out here.
        # Three workflows each named their own subset, and catalog-drift's subset
        # was missing jsonschema - which tests/test_schema_rules.py needs. The
        # drift showed up as unittest.loader._FailedTest, i.e. as a broken test
        # rather than as a missing package. One file, three workflows, no
        # possibility of them disagreeing again.
        run: python -m pip install --quiet -r requirements.txt

      - name: Check generated markdown is in sync with meta.yaml
        run: python _scripts/list_achievements.py --check

      - name: Check relative links and heading anchors resolve
        run: python tests/check_links.py

      - name: Check workflow files parse and reference real scripts
        run: python tests/check_workflows.py

      - name: Check documented commands are real and runnable
        run: python -m unittest tests.test_scripts.TestDocumentedCommandsAreReal -v

      - name: Check catalog statuses against the live profile
        run: python _scripts/grant_check.py --account neohiro

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint
        run: |
          # Pinned to the version these checks were last verified against, so a new
          # ruff release cannot turn a green build red (or silently change which
          # rules apply) without a reviewable diff.
          python -m pip install --quiet "ruff==0.16.6"
          python -m ruff check _scripts tests

  # grant_check.py exits 2 when reality and the catalog disagree. That is not a
  # build failure, it is a finding, so it is surfaced as a job summary instead of
  # a red X that trains everyone to ignore the check.
  drift-summary:
    runs-on: ubuntu-latest
    needs: catalog
    if: always()
    steps:
      - name: Explain non-zero drift exit
        if: needs.catalog.result == 'failure'
        run: |
          echo "### Catalog drift detected" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A \`status:\` in \`_achievements/*/meta.yaml\` disagrees with the" \
               "live profile." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Fix the meta.yaml, do not suppress the check.** If a badge was" \
               "genuinely earned, add a \`verified:\` block recording the tier," \
               "date, and the asset that proved it — see" \
               "_docs/VERIFICATION.md." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If someone recently disabled the public-profile achievement" \
               "toggle, expect a mass 'stale-earned' result and re-check before" \
               "editing nine files." >> "$GITHUB_STEP_SUMMARY"