name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate achievement catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate meta.yaml files (YAML parse)
        run: python _scripts/list_achievements.py --check

      - name: Validate meta.yaml files (JSON Schema strict)
        run: python _scripts/list_achievements.py --validate-schema --check

      - name: Run unit tests
        run: python _scripts/test_file_vuln_issues.py

      - name: Print achievement table
        run: python _scripts/list_achievements.py
