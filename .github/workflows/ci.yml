name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate achievement catalog
    runs-on: ubuntu-latest
    # The sync check runs `file_vuln_issues.py --sync --dry-run`, which calls
    # `gh issue list`. Without a token gh is unauthenticated and the call fails,
    # so the check could never pass. `contents: read` is all it needs: the sync is
    # a dry run and issues no writes.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No cache: pip's cache keys off a dependency file (requirements.txt /
          # pyproject.toml), and this repo has none -- it installs a fixed
          # dependency set inline below. With cache: pip set, every run aborted
          # here with "No file ... matched to [**/requirements.txt or
          # **/pyproject.toml]", so the validation this job exists to perform
          # never executed.

      - name: Install dependencies
        run: pip install pyyaml jsonschema ruff

      - name: Run full validation
        env:
          # Required: the sync check shells out to `gh`, which needs a token.
          GH_TOKEN: ${{ github.token }}
        run: python _scripts/neohiro_validate.py

      - name: Print achievement table
        run: python _scripts/list_achievements.py
