name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate achievement catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No cache: pip's cache keys off a dependency file (requirements.txt /
          # pyproject.toml), and this repo has none -- it installs a fixed
          # dependency set inline below. With cache: pip set, every run aborted
          # here with "No file ... matched to [**/requirements.txt or
          # **/pyproject.toml]", so the validation this job exists to perform
          # never executed.

      - name: Install dependencies
        run: pip install pyyaml jsonschema ruff

      - name: Run full validation
        run: python _scripts/neohiro_validate.py

      - name: Print achievement table
        run: python _scripts/list_achievements.py
